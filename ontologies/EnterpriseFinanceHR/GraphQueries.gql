/* Enterprise Finance + HR graph patterns. Employee data is pseudonymized synthetic sample data only. */
MATCH (a:LegalEntity)-[]->(b:BusinessUnit) RETURN a,b;
MATCH (a:BusinessUnit)-[]->(b:Department) RETURN a,b;
MATCH (a:BusinessUnit)-[]->(b:CostCenter) RETURN a,b;
MATCH (a:Department)-[]->(b:Employee) RETURN a,b;
MATCH (a:Department)-[]->(b:CostCenter) RETURN a,b;
MATCH (a:Employee)-[]->(b:Position) RETURN a,b;
MATCH (a:Position)-[]->(b:JobFamily) RETURN a,b;
MATCH (a:Position)-[]->(b:CostCenter) RETURN a,b;
MATCH (a:Department)-[]->(b:Location) RETURN a,b;
MATCH (a:CostCenter)-[]->(b:Project) RETURN a,b;
MATCH (a:FiscalPeriod)-[]->(b:HeadcountSnapshot) RETURN a,b;
MATCH (a:FiscalPeriod)-[]->(b:CompensationPlan) RETURN a,b;
MATCH (a:FiscalPeriod)-[]->(b:WorkforceMovement) RETURN a,b;
MATCH (a:FiscalPeriod)-[]->(b:BudgetPlan) RETURN a,b;
MATCH (a:FiscalPeriod)-[]->(b:ActualLedger) RETURN a,b;
MATCH (a:FiscalPeriod)-[]->(b:ForecastScenario) RETURN a,b;
MATCH (a:CostCenter)-[]->(b:BudgetPlan) RETURN a,b;
MATCH (a:CostCenter)-[]->(b:ActualLedger) RETURN a,b;
MATCH (a:CostCenter)-[]->(b:ForecastScenario) RETURN a,b;
MATCH (a:Account)-[]->(b:BudgetPlan) RETURN a,b;
MATCH (a:Account)-[]->(b:ActualLedger) RETURN a,b;
/* Compensation planning paths */
MATCH (e:Employee)-[]->(c:EmployeeCompensationSnapshot)-[]->(p:PayGrade) RETURN e,c,p;
MATCH (p:FiscalPeriod)-[]->(c:EmployeeCompensationSnapshot)-[]->(k:CompensationComponent) RETURN p,c,k;
MATCH (e:Employee)-[]->(c:EmployeeCompensationSnapshot)-[]->(p:FiscalPeriod) RETURN e,c,p;
/* Attendance and schedule paths */
MATCH (e:Employee)-[]->(a:TimeAttendanceDaily)-[]->(d:CalendarDate) RETURN e,a,d;
MATCH (a:TimeAttendanceDaily)-[]->(s:WorkSchedule) RETURN a,s;
MATCH (a:TimeAttendanceDaily)-[]->(c:AttendanceCode) RETURN a,c;
MATCH (p:FiscalPeriod)-[]->(d:CalendarDate)-[]->(a:TimeAttendanceDaily) RETURN p,d,a;
/* Absence paths */
MATCH (e:Employee)-[]->(a:AbsenceEpisode)-[]->(l:LeaveType) RETURN e,a,l;
MATCH (a:AbsenceEpisode)-[]->(r:AbsenceReasonCategory) RETURN a,r;
MATCH (a:AbsenceEpisode)-[]->(d:CalendarDate) RETURN a,d;
/* Recruitment paths */
MATCH (r:JobRequisition)-[]->(p:Position) RETURN r,p;
MATCH (r:JobRequisition)-[]->(d:Department) RETURN r,d;
MATCH (r:JobRequisition)-[]->(c:CostCenter) RETURN r,c;
MATCH (r:JobRequisition)-[]->(d:CalendarDate) RETURN r,d;
MATCH (c:Candidate)-[]->(s:RecruitmentSource) RETURN c,s;
MATCH (c:Candidate)-[]->(e:RecruitmentStageEvent)-[]->(s:RecruitmentStage) RETURN c,e,s;
MATCH (c:Candidate)-[]->(o:Offer) RETURN c,o;
MATCH (r:JobRequisition)-[]->(e:RecruitmentStageEvent)-[]->(c:Candidate) RETURN r,e,c;
MATCH (r:JobRequisition)-[]->(o:Offer)-[]->(c:Candidate) RETURN r,o,c;
MATCH (p:FiscalPeriod)-[]->(d:CalendarDate)-[]->(o:Offer) RETURN p,d,o;