/*
 * Smart Building Ontology - GQL Example Queries
 * ===============================================
 * Graph Query Language (GQL) - ISO/IEC 39075:2024
 *
 * Graph Schema:
 *   Nodes: Building, Floor, Zone, HVAC, Lighting, Elevator,
 *          Sensor, EnergyMeter, Occupant, AccessPoint, MaintenanceTicket, Alert
 *
 *   Edges:
 *     Building -[BuildingHasFloor]-> Floor
 *     Floor -[FloorHasZone]-> Zone
 *     Zone -[ZoneHasHVAC]-> HVAC
 *     Zone -[ZoneHasLighting]-> Lighting
 *     Zone -[ZoneHasSensor]-> Sensor
 *     Zone -[ZoneHasAccessPoint]-> AccessPoint
 *     Building -[BuildingHasElevator]-> Elevator
 *     Building -[BuildingHasEnergyMeter]-> EnergyMeter
 *     Alert -[AlertFromSensor]-> Sensor
 *     MaintenanceTicket -[TicketAssignedTo]-> Occupant
 *     Building -[BuildingHasOccupant]-> Occupant
 */


/* ===== Query 1: Full Building Topology ===== */

MATCH (n)-[e]->(m)
RETURN n, e, m
LIMIT 200


/* ===== Query 2: Building Floors and Zones ===== */

MATCH (b:Building)-[:BuildingHasFloor]->(f:Floor)-[:FloorHasZone]->(z:Zone)
RETURN b.BuildingName AS Building,
       f.FloorNumber AS Floor,
       f.FloorNumber AS FloorNum,
       z.ZoneName AS Zone,
       z.ZoneType AS ZoneType,
       z.MaxOccupancy AS MaxOccupancy
LIMIT 100


/* ===== Query 3: Zone HVAC and Lighting Systems ===== */

MATCH (z:Zone)-[:ZoneHasHVAC]->(h:HVAC)
MATCH (z)-[:ZoneHasLighting]->(l:Lighting)
RETURN z.ZoneName AS Zone,
       h.HVACName AS HVAC,
       h.HVACType AS HVACType,
       h.CapacityBTU AS CapacityBTU,
       l.LightingName AS Lighting,
       l.WattageTotalW AS Wattage
LIMIT 100


/* ===== Query 4: Sensor Alerts by Severity ===== */

MATCH (s:Sensor)<-[:AlertFromSensor]-(a:Alert)
RETURN s.SensorName AS Sensor,
       s.SensorType AS SensorType,
       a.AlertType AS AlertType,
       a.Severity AS Severity,
       a.AlertValue AS Value,
       a.ThresholdValue AS Threshold,
       a.AlertTimestamp AS `Timestamp`
ORDER BY a.AlertTimestamp DESC
LIMIT 50


/* ===== Query 5: Building Elevator Inventory ===== */

MATCH (b:Building)-[:BuildingHasElevator]->(e:Elevator)
RETURN b.BuildingName AS Building,
       e.ElevatorName AS Elevator,
       e.ElevatorType AS Type,
       e.CapacityLbs AS CapacityLbs,
       e.MaxFloors AS MaxFloors
LIMIT 50


/* ===== Query 6: Maintenance Tickets by Assignee ===== */

MATCH (occ:Occupant)<-[:TicketAssignedTo]-(t:MaintenanceTicket)
RETURN occ.OccupantName AS Assignee,
       occ.Company AS Company,
       t.TicketId AS Ticket,
       t.EquipmentType AS EquipmentType,
       t.Priority AS Priority,
       t.DurationHours AS Hours,
       t.CostUSD AS Cost,
       t.Status AS Status
ORDER BY t.CreatedDate DESC
LIMIT 50


/* ===== Query 7: Building Energy Meters ===== */

MATCH (b:Building)-[:BuildingHasEnergyMeter]->(m:EnergyMeter)
RETURN b.BuildingName AS Building,
       m.MeterName AS Meter,
       m.MeterType AS Type,
       m.MeasurementUnit AS Unit,
       m.CoverageAreaSqFt AS CoverageArea
LIMIT 50


/* ===== Query 8: Sensors per Zone with Coverage ===== */

MATCH (b:Building)-[:BuildingHasFloor]->(f:Floor)-[:FloorHasZone]->(z:Zone)-[:ZoneHasSensor]->(s:Sensor)
RETURN b.BuildingName AS Building,
       z.ZoneName AS Zone,
       z.ZoneType AS ZoneType,
       COUNT(s) AS SensorCount
LIMIT 50


/* ===== Query 9: Critical Alerts with Full Path ===== */

MATCH (b:Building)-[:BuildingHasFloor]->(f:Floor)-[:FloorHasZone]->(z:Zone)-[:ZoneHasSensor]->(s:Sensor)<-[:AlertFromSensor]-(a:Alert)
WHERE a.Severity = 'Critical'
RETURN b.BuildingName AS Building,
       f.FloorNumber AS Floor,
       z.ZoneName AS Zone,
       s.SensorName AS Sensor,
       a.AlertType AS AlertType,
       a.AlertValue AS Value,
       a.AlertTimestamp AS `Timestamp`
LIMIT 50


/* ===== Query 10: Zone Occupant Distribution ===== */

MATCH (b:Building)-[:BuildingHasOccupant]->(o:Occupant)
MATCH (b)-[:BuildingHasFloor]->(f:Floor)-[:FloorHasZone]->(z:Zone)
RETURN b.BuildingName AS Building,
       z.ZoneName AS Zone,
       z.ZoneType AS ZoneType,
       z.MaxOccupancy AS MaxCapacity,
       COUNT(DISTINCT o) AS OccupantCount,
       o.Company AS Company
LIMIT 100


/* ===== Query 11: HVAC Systems Needing Maintenance ===== */

MATCH (z:Zone)-[:ZoneHasHVAC]->(h:HVAC)
MATCH (z)-[:ZoneHasSensor]->(s:Sensor)<-[:AlertFromSensor]-(a:Alert)
WHERE s.SensorType = 'Temperature' AND a.Severity IN ['Critical', 'High']
RETURN z.ZoneName AS Zone,
       h.HVACName AS HVAC,
       h.HVACType AS HVACType,
       a.AlertType AS AlertType,
       a.AlertValue AS TempReading,
       a.ThresholdValue AS Threshold
LIMIT 50


/* ===== Query 12: WiFi Coverage per Zone ===== */

MATCH (z:Zone)-[:ZoneHasAccessPoint]->(ap:AccessPoint)
RETURN z.ZoneName AS Zone,
       z.AreaSqFt AS ZoneArea,
       ap.APName AS AccessPoint,
       ap.BandSupport AS BandSupport,
       ap.MaxConnections AS MaxConnections

/* ===== Query 13: High-Cost Maintenance by Equipment Type ===== */

MATCH (t:MaintenanceTicket)-[:TicketAssignedTo]->(o:Occupant)
WHERE t.Priority = 'High'
RETURN t.TicketType AS TicketType,
       t.Priority AS Priority,
       t.Status AS Status,
       o.OccupantName AS Technician,
       t.Description AS Description
ORDER BY t.Priority DESC
LIMIT 20


/* ===== Query 14: Elevator Status per Building ===== */

MATCH (b:Building)-[:BuildingHasElevator]->(e:Elevator)
RETURN b.BuildingName AS Building,
       e.ElevatorName AS Elevator,
       e.MaxFloors AS MaxFloors,
       e.CapacityLbs AS Capacity,
       e.ElevatorType AS Type
ORDER BY b.BuildingName

/* ===== Query 15: Energy Meter Readings per Building ===== */

MATCH (b:Building)-[:BuildingHasEnergyMeter]->(em:EnergyMeter)
RETURN b.BuildingName AS Building,
       em.MeterName AS Meter,
       em.MeterType AS MeterType,
       em.MeasurementUnit AS Unit,
       em.CoverageAreaSqFt AS CoverageArea
ORDER BY b.BuildingName

/* ===== Query 16: Zones with No Sensors (gap detection) ===== */

MATCH (z:Zone)
WHERE NOT EXISTS { MATCH (z)-[:ZoneHasSensor]->(:Sensor) }
RETURN z.ZoneName AS Zone,
       z.ZoneType AS ZoneType,
       z.AreaSqFt AS Area,
       z.MaxOccupancy AS MaxOccupancy

/* ===== Query 17: Full Building Asset Chain (4-hop) ===== */

MATCH (b:Building)-[:BuildingHasFloor]->(f:Floor)-[:FloorHasZone]->(z:Zone)-[:ZoneHasSensor]->(s:Sensor)
RETURN b.BuildingName AS Building,
       f.FloorNumber AS Floor,
       z.ZoneName AS Zone,
       s.SensorName AS Sensor,
       s.SensorType AS SensorType,
       s.Status AS SensorStatus
ORDER BY b.BuildingName, f.FloorNumber, z.ZoneName
LIMIT 50

/* ===== Query 18: Maintenance Cost by Building ===== */

MATCH (b:Building)-[:BuildingHasOccupant]->(o:Occupant)<-[:TicketAssignedTo]-(t:MaintenanceTicket)
WHERE t.Status = 'Resolved'
RETURN b.BuildingName AS Building,
       COUNT(t) AS TicketCount
ORDER BY TicketCount DESC

/* ===== Query 19: HVAC Systems with High Capacity by Zone ===== */

MATCH (z:Zone)-[:ZoneHasHVAC]->(hvac:HVAC)
WHERE hvac.CapacityBTU > 50000
RETURN z.ZoneName AS Zone,
       hvac.HVACName AS HVACSystem,
       hvac.HVACType AS Type,
       hvac.CapacityBTU AS Capacity,
       hvac.EnergyRating AS EnergyRating
ORDER BY hvac.CapacityBTU DESC

/* ===== Query 20: Multi-System Zone Summary ===== */

MATCH (z:Zone)
OPTIONAL MATCH (z)-[:ZoneHasSensor]->(s:Sensor)
OPTIONAL MATCH (z)-[:ZoneHasHVAC]->(hvac:HVAC)
OPTIONAL MATCH (z)-[:ZoneHasAccessPoint]->(ap:AccessPoint)
RETURN z.ZoneName AS Zone,
       z.ZoneType AS ZoneType,
       COUNT(DISTINCT s) AS Sensors,
       COUNT(DISTINCT hvac) AS HVACSystems,
       COUNT(DISTINCT ap) AS AccessPoints
ORDER BY z.ZoneName
