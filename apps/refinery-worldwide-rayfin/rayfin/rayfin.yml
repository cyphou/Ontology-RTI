id: refinery-worldwide
name: Geo Refinery Twin Worldwide
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - https://quiet-smoke-721dc7405e-westcentralus.webapp.msit.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
