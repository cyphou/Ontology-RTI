id: enterprise-finance-hr
name: Enterprise Finance + HR Planning
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://extra-reach-179d6557f8-westcentralus.webapp.msit.fabricapps.net
